<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publications — DT-U-Bordeaux — Digital Twin Research Group, University of Bordeaux</title>
<meta name="description" content="Publications of the Digital Twin Research Group, University of Bordeaux.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body data-page="publications">
<header id="site-header"></header>
<main>
  <section class="page-hero">
    <div class="wrap">
      <span class="eyebrow">Publications</span>
      <h1>Publications</h1>
      <p class="lead">Journal articles, conference papers, book chapters and theses from the group. Filter by type or project, or search by title and author.</p>
    </div>
  </section>
  <section class="section">
    <div class="wrap">
      <div class="filters" id="pub-types"></div>
      <div class="controls">
        <input type="search" id="pub-search" placeholder="Search title, author, venue…" aria-label="Search publications">
        <select id="pub-project" aria-label="Filter by project"></select>
      </div>
      <div id="pub-list"></div>
    </div>
  </section>
</main>
<footer id="site-footer"></footer>
<script src="data.js"></script>
<script src="app.js"></script>

</html>
