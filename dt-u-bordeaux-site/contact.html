<body data-page="contact">
<header id="site-header"></header>
<main>
  <section class="page-hero">
    <div class="wrap">
      <span class="eyebrow">Contact</span>
      <h1>Get in touch</h1>
      <p class="lead">Interested in collaborating, joining the group as an intern, PhD student or postdoc, or partnering on a project? We would be glad to hear from you.</p>
    </div>
  </section>
  <section class="section">
    <div class="wrap contact-grid">
      <div class="card">
        <h3><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Address</h3>
        <p id="contact-address"></p>
      </div>
      <div class="card">
        <h3><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Email</h3>
        <p id="contact-email"></p>
      </div>
      <div class="card">
        <h3><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 6 4.8"/></svg>Join us</h3>
        <p class="muted">Open internship, PhD and postdoc positions will be listed here.</p>
      </div>
    </div>
  </section>
</main>
<footer id="site-footer"></footer>
